version: '3.9'

services:

  # ─── Databases ─────────────────────────────────────────────

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: dealflow
      POSTGRES_PASSWORD: dealflow_dev
    ports:
      - "5432:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealflow -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: dealflow
      POSTGRES_PASSWORD: dealflow_dev
    ports:
      - "5433:5432"
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealflow -d catalog_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  quotation-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quotation_db
      POSTGRES_USER: dealflow
      POSTGRES_PASSWORD: dealflow_dev
    ports:
      - "5434:5432"
    volumes:
      - quotation_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealflow -d quotation_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  fulfillment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fulfillment_db
      POSTGRES_USER: dealflow
      POSTGRES_PASSWORD: dealflow_dev
    ports:
      - "5435:5432"
    volumes:
      - fulfillment_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealflow -d fulfillment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  billing-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: billing_db
      POSTGRES_USER: dealflow
      POSTGRES_PASSWORD: dealflow_dev
    ports:
      - "5436:5432"
    volumes:
      - billing_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealflow -d billing_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  analytics-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: analytics_db
      POSTGRES_USER: dealflow
      POSTGRES_PASSWORD: dealflow_dev
    ports:
      - "5437:5432"
    volumes:
      - analytics_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealflow -d analytics_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ─────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Email (Local SMTP Trap) ────────────────────────────────

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP — services send here
      - "8025:8025"   # Web UI — view emails at http://localhost:8025

  # ─── Auth Service ──────────────────────────────────────────

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      PORT: 3001
      AUTH_DATABASE_URL: postgresql://dealflow:dealflow_dev@auth-db:5432/auth_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_change_in_prod_must_be_64_chars_minimum_dev_only_x
      JWT_ACCESS_EXPIRY: 28800
      JWT_REFRESH_EXPIRY: 2592000
      MAGIC_LINK_TTL_SECONDS: 86400
      PORTAL_SESSION_TTL_SECONDS: 604800
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@dealflow360.dev
      APP_BASE_URL: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/auth-service/src:/app/src
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ─── Catalog Service ───────────────────────────────────────

  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      PORT: 3002
      CATALOG_DATABASE_URL: postgresql://dealflow:dealflow_dev@catalog-db:5432/catalog_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_change_in_prod_must_be_64_chars_minimum_dev_only_x
      SERVICE_TOKEN: dev_service_token_for_internal_calls_min_16
    ports:
      - "3002:3002"
    depends_on:
      catalog-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/catalog-service/src:/app/src
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ─── Quotation Service ─────────────────────────────────────

  quotation-service:
    build:
      context: ./services/quotation-service
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      PORT: 3003
      QUOTATION_DATABASE_URL: postgresql://dealflow:dealflow_dev@quotation-db:5432/quotation_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_change_in_prod_must_be_64_chars_minimum_dev_only_x
      CATALOG_SERVICE_URL: http://catalog-service:3002
      FULFILLMENT_SERVICE_URL: http://fulfillment-service:3004
      SERVICE_TOKEN: dev_service_token_for_internal_calls_min_16
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@dealflow360.dev
      APP_BASE_URL: http://localhost:3000
    ports:
      - "3003:3003"
    depends_on:
      quotation-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    volumes:
      - ./services/quotation-service/src:/app/src
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ─── Fulfillment Service ───────────────────────────────────

  fulfillment-service:
    build:
      context: ./services/fulfillment-service
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      PORT: 3004
      FULFILLMENT_DATABASE_URL: postgresql://dealflow:dealflow_dev@fulfillment-db:5432/fulfillment_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_change_in_prod_must_be_64_chars_minimum_dev_only_x
      CATALOG_SERVICE_URL: http://catalog-service:3002
      SERVICE_TOKEN: dev_service_token_for_internal_calls_min_16
    ports:
      - "3004:3004"
    depends_on:
      fulfillment-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    volumes:
      - ./services/fulfillment-service/src:/app/src
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ─── Billing Service ───────────────────────────────────────

  billing-service:
    build:
      context: ./services/billing-service
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      PORT: 3005
      BILLING_DATABASE_URL: postgresql://dealflow:dealflow_dev@billing-db:5432/billing_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_change_in_prod_must_be_64_chars_minimum_dev_only_x
      SERVICE_TOKEN: dev_service_token_for_internal_calls_min_16
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@dealflow360.dev
    ports:
      - "3005:3005"
    depends_on:
      billing-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/billing-service/src:/app/src
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3005/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Analytics Service ─────────────────────────────────────

  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      PORT: 3006
      ANALYTICS_DATABASE_URL: postgresql://dealflow:dealflow_dev@analytics-db:5432/analytics_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_change_in_prod_must_be_64_chars_minimum_dev_only_x
      SERVICE_TOKEN: dev_service_token_for_internal_calls_min_16
      QUOTATION_SERVICE_URL: http://quotation-service:3003
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@dealflow360.dev
    ports:
      - "3006:3006"
    depends_on:
      analytics-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/analytics-service/src:/app/src
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3006/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── API Gateway / BFF ─────────────────────────────────────

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3002
      QUOTATION_SERVICE_URL: http://quotation-service:3003
      FULFILLMENT_SERVICE_URL: http://fulfillment-service:3004
      BILLING_SERVICE_URL: http://billing-service:3005
      ANALYTICS_SERVICE_URL: http://analytics-service:3006
      JWT_SECRET: dev_jwt_secret_change_in_prod_must_be_64_chars_minimum_dev_only_x
      REDIS_URL: redis://redis:6379
      ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      quotation-service:
        condition: service_healthy
      fulfillment-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    volumes:
      - ./services/gateway/src:/app/src
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Frontend ──────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api/v1
      VITE_PORTAL_BASE_URL: http://localhost:3000/portal/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  auth_db_data:
  catalog_db_data:
  quotation_db_data:
  fulfillment_db_data:
  billing_db_data:
  analytics_db_data:
  redis_data:
